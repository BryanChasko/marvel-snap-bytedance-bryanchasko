# marvel-snap project extensions — uses persistent HTTP MCP bridges
# instead of per-session Docker container launchers
#
# bridges connect to already-running infra endpoints (heraldstack-infra):
#   qdrant: 8100 (copywriting), 8101 (writing-inbox), 8102 (shared-knowledge)
#   valkey: 8110
#
# run scripts/snap-setup.sh to verify infra is up before starting a session

extensions:

  # --- core (builtins) ---

  developer:
    enabled: true
    type: builtin
    name: developer
    timeout: 600

  summon:
    enabled: true
    type: builtin
    name: summon
    timeout: 300

  # --- core (stdio) ---

  github:
    enabled: true
    type: stdio
    name: github
    cmd: /home/bryanchasko/code/heraldstack/heraldstack-mcp/launchers/core/github.sh
    args: []
    timeout: 300

  # --- docs ---

  context7:
    enabled: true
    type: stdio
    name: context7
    cmd: /home/bryanchasko/code/heraldstack/heraldstack-mcp/launchers/core/context7.sh
    args: []
    timeout: 300

  # --- memory (bridges to persistent HTTP endpoints) ---

  qdrant-shared:
    enabled: true
    type: stdio
    name: qdrant-shared
    cmd: /home/bryanchasko/code/heraldstack/heraldstack-mcp/launchers/bridges/qdrant-shared-knowledge-bridge.sh
    args: []
    timeout: 300

  valkey:
    enabled: true
    type: stdio
    name: valkey
    cmd: /home/bryanchasko/code/heraldstack/heraldstack-mcp/launchers/bridges/valkey-bridge.sh
    args: []
    timeout: 120
