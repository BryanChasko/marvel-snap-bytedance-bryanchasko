# marvel-snap project extensions — lighter set for this project
# uses container-based launchers (Docker-in-Docker) that work inside goose container
# bridge launchers (npx supergateway) do not work inside Docker — no Node.js
#
# run scripts/snap-setup.sh to verify infra is up before starting a session

extensions:

  # --- core (builtins) ---

  developer:
    enabled: true
    type: builtin
    name: developer
    timeout: 600

  summon:
    enabled: true
    type: builtin
    name: summon
    timeout: 300

  # --- core (stdio) ---

  github:
    enabled: true
    type: stdio
    name: github
    cmd: /home/bryanchasko/code/heraldstack/heraldstack-mcp/launchers/core/github.sh
    args: []
    timeout: 300

  # --- docs ---

  context7:
    enabled: true
    type: stdio
    name: context7
    cmd: /home/bryanchasko/code/heraldstack/heraldstack-mcp/launchers/core/context7.sh
    args: []
    timeout: 300

  # --- memory (container-based launchers — Docker-in-Docker) ---

  qdrant-shared:
    enabled: true
    type: stdio
    name: qdrant-shared
    cmd: /home/bryanchasko/code/heraldstack/heraldstack-mcp/launchers/core/qdrant.sh
    args: ["shared-knowledge"]
    timeout: 300

  valkey:
    enabled: true
    type: stdio
    name: valkey
    cmd: /home/bryanchasko/code/heraldstack/heraldstack-mcp/launchers/core/valkey-mcp.sh
    args: []
    timeout: 120
