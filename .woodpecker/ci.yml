---
# pipeline: marvel-snap-bytedance
# stack: docs + specs + fixtures + scripts (no build artifact)
# template: markdown-lint.yaml + schema-validation + secret-scan
#
# hard rules (from woodpecker-templates/README.md):
#   - no failure: ignore
#   - no yaml anchors in multi-line command blocks
#   - path: singular under when entries
#   - no volumes: or privileged: in step yaml

when:
  - event: [pull_request, push, manual]
    branch: main
    path:
      include:
        - "**/*.md"
        - "**/*.yml"
        - "**/*.yaml"
        - "**/*.sh"
        - "**/*.json"
        - specs/**
        - fixtures/**
        - .woodpecker/**

steps:
  - name: tier-0-draft-gate
    image: alpine:3.21
    commands:
      - |
        if [ "${CI_COMMIT_PULL_REQUEST_DRAFT}" = "true" ]; then
          echo "draft pr — halting"
          exit 1
        fi
    failure: fail
    when:
      - event: [pull_request, push, manual]

  - name: tier-0-skip-ci-gate
    image: alpine:3.21
    commands:
      - |
        if echo "${CI_COMMIT_MESSAGE}" | grep -qi '\[skip ci\]\|\[ci skip\]'; then
          echo "[skip ci] detected — halting"
          exit 1
        fi
    failure: fail
    depends_on: [tier-0-draft-gate]
    when:
      - event: [pull_request, push, manual]

  - name: tier-0-metadata
    image: alpine:3.21
    commands:
      - |
        echo "branch: ${CI_COMMIT_BRANCH}"
        echo "commit: ${CI_COMMIT_SHA:0:8}"
        echo "author: ${CI_COMMIT_AUTHOR}"
        echo "event: ${CI_PIPELINE_EVENT}"
    depends_on: [tier-0-skip-ci-gate]
    when:
      - event: [pull_request, push, manual]

  - name: validate-schema
    image: python:3.12-slim
    depends_on: [tier-0-metadata]
    commands:
      - pip install -q jsonschema
      - python3 -c "import json; from jsonschema import validate; schema=json.load(open('specs/game-reconstruction/schema.json')); record=json.load(open('fixtures/sample_game_record.json')); validate(record, schema); print('sample_game_record.json validates against schema')"

  - name: markdown-lint
    image: davidanson/markdownlint-cli2:v0.14.0
    commands:
      # no failure: ignore -- if real lint issues appear, tune .markdownlint.json
      - markdownlint-cli2 "**/*.md"

  - name: yaml-lint
    image: cytopia/yamllint:latest
    commands:
      # relaxed preset: no line-length enforcement, permissive indentation
      - yamllint -d relaxed .

  - name: shell-lint
    image: alpine:3.21
    commands:
      - apk add --no-cache shellcheck >/dev/null
      - find . -type f -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 -r shellcheck

  - name: scan-secrets
    image: alpine:latest
    commands:
      - |
        FOUND=0
        for pattern in 'AKIA[0-9A-Z]{16}' 'sk-[a-zA-Z0-9]{48}' 'ghp_[a-zA-Z0-9]{36}'; do
          if grep -rn --include='*.sh' --include='*.yaml' --include='*.yml' --include='*.json' --include='*.md' \
             -E "$pattern" . 2>/dev/null | grep -v '.woodpecker/ci.yml' | grep -v 'fixtures/'; then
            echo "potential secret pattern found: $pattern"
            FOUND=1
          fi
        done
        if [ "$FOUND" -eq 1 ]; then
          echo "secrets scan failed - review matches above"
          exit 1
        fi
        echo "no secrets detected"
